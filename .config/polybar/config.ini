# font-0 = "Plus Jakarta Sans Medium:size=11;2"
# font-1 = "Noto Sans CJK JP:size=10;3"
# width = 15%
# offset-x = 85%
# modules-center = date

[bar/center]
inherit = bar/main
font-0 = "Plus Jakarta Sans Medium:size=10;2"
font-1 = "Noto Sans CJK JP:size=10;3"
font-2 = "Noto Serif Tibetan:size=10;3"
width = 180
offset-x = 50%:-90
offset-y = 10
bottom = false
modules-left = time
modules-center = title
modules-right = date
padding-left = 10
padding-right = 10