[global/wm]
margin-bottom = 0
margin-top = 1

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/main]
;monitor = LVDS-1
bottom = false
fixed-center = true

wm-restack = bspwm

height = 35
offset-y = 15
offset-x = 15

background = ${color.nord-polar-1}
foreground = ${color.nord-snow-2}
radius = 20
pseudo-transparency = false


locale = ja_JP.UTF-8

# [bar/left]
# inherit = bar/main
